<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Media Portfolio</title>

  <style>

    /* =========================================
       BASIC PAGE SETTINGS
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: "Courier New", Courier, monospace;
    }


    /* =========================================
       PORTFOLIO
    ========================================= */

    .portfolio {
      position: relative;

      width: 100%;
      max-width: 1000px;

      margin: 0 auto;
      padding: 20px 70px 35px;
    }


    /* =========================================
       CAROUSEL
    ========================================= */

    .carousel-window {
      width: 100%;
      overflow: hidden;
      margin: 0 auto;
    }

    .carousel {
      width: 100%;

      display: flex;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }


    /* =========================================
       INDIVIDUAL VIDEO CARD
    ========================================= */

    .video-card {
      min-width: 100%;
      width: 100%;
      flex: 0 0 100%;

      scroll-snap-align: center;
      scroll-snap-stop: always;

      display: flex;
      flex-direction: column;
      align-items: center;

      color: white;
      text-decoration: none;
    }


    /* =========================================
       VIDEO THUMBNAILS
    ========================================= */

    .thumbnail {
      position: relative;

      width: 100%;
      max-width: 800px;

      aspect-ratio: 16 / 9;

      margin: 0 auto;

      overflow: hidden;

      background: #111;
      border-radius: 6px;
    }

    .thumbnail img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail img {
      transform: scale(1.02);
    }


    /* =========================================
       PLAY BUTTON
    ========================================= */

    .play-button {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 78px;
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.78);

      color: white;

      font-size: 32px;

      pointer-events: none;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .video-card:hover .play-button {
      transform:
        translate(-50%, -50%)
        scale(1.1);

      background: #000;
    }


    /* =========================================
       VIDEO TITLES
    ========================================= */

    .title {
      width: 100%;
      max-width: 800px;

      margin: 18px auto 0;

      text-align: center;

      font-family:
        "Courier New",
        Courier,
        monospace;

      font-size: 24pt;
      font-weight: normal;
      line-height: 1.2;

      color: white;
    }


    /* =========================================
       LEFT / RIGHT ARROWS
    ========================================= */

    .arrow {
      position: absolute;

      top: 43%;

      transform: translateY(-50%);

      width: 50px;
      height: 80px;

      border: 0;
      border-radius: 4px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-family:
        "Courier New",
        Courier,
        monospace;

      font-size: 40px;

      cursor: pointer;

      z-index: 20;

      transition: background 0.2s ease;
    }

    .arrow:hover {
      background: #000;
    }

    .arrow-left {
      left: 8px;
    }

    .arrow-right {
      right: 8px;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      .portfolio {
        padding:
          15px
          45px
          30px;
      }

      .title {
        font-size: 20pt;
      }

      .arrow {
        width: 36px;
        height: 60px;

        font-size: 28px;
      }

      .play-button {
        width: 58px;
        height: 58px;

        font-size: 24px;
      }

    }

  </style>
</head>


<body>


  <div class="portfolio">


    <!-- =========================================

            <div class="play-button">
              ▶
            </div>

          </div>

          <div class="title">
            GUNK
          </div>

        </a>


      </div>

    </div>



    <!-- =========================================
         RIGHT ARROW
    ========================================== -->

    <button
      class="arrow arrow-right"
      type="button"
      aria-label="Next video"
      onclick="moveCarousel(1)">
      ›
    </button>


  </div>



  <!-- =========================================
       CAROUSEL JAVASCRIPT
  ========================================== -->

  <script>

    function moveCarousel(direction) {

      const carousel =
        document.getElementById("videoCarousel");

      carousel.scrollBy({
        left:
          direction *
          carousel.clientWidth,

        behavior: "smooth"
      });

    }

  </script>


</body>

</html>
