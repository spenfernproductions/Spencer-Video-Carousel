<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: "Courier New", Courier, monospace;
    }

    .portfolio {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 70px 35px;
    }

    .carousel-window {
      width: 100%;
      overflow: hidden;
      margin: 0 auto;
    }

    .carousel {
      width: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      min-width: 100%;
      width: 100%;
      flex: 0 0 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: white;
    }

    .thumbnail {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      position: relative;
      margin: 0 auto;
      overflow: hidden;
      background: #111;
      border-radius: 6px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transition: transform .3s ease;
    }

    .video-card:hover .thumbnail img {
      transform: scale(1.02);
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, .78);
      color: white;
      font-size: 32px;
      transition: .2s ease;
    }

    .video-card:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
      background: #000;
    }

    .title {
      width: 100%;
      max-width: 800px;
      margin: 18px auto 0;
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 24pt;
      font-weight: normal;
      line-height: 1.2;
      color: white;
    }

    .arrow {
      position: absolute;
      top: 43%;
      transform: translateY(-50%);
      width: 50px;
      height: 80px;
      border: 0;
      border-radius: 4px;
      background: rgba(0, 0, 0, .75);
      color: white;
      font-family: "Courier New", Courier, monospace;
      font-size: 40px;
      cursor: pointer;
      z-index: 20;
    }

    .arrow:hover {
      background: #000;
    }

    .arrow-left {
      left: 8px;
    }

    .arrow-right {
      right: 8px;
    }

    @media(max-width:700px) {
      .portfolio {
        padding: 15px 45px 30px;
      }

      .title {
        font-size: 20pt;
      }

      .arrow {
        width: 36px;
        height: 60px;
        font-size: 28px;
      }

      .play-button {
        width: 58px;
        height: 58px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="portfolio">

    <button
      class="arrow arrow-left"
      aria-label="Previous video"
      onclick="move(-1)">
      ‹
    </button>

    <div class="carousel-window">

      <div class="carousel" id="videoCarousel">

        <!-- PAPERCUT - FIRST VIDEO -->
        <a
          class="video-card"
          href="https://vimeo.com/788388427"
          target="_blank"
          rel="noopener">

          <div class="thumbnail">
            <img
              src="https://vumbnail.com/788388427.jpg"
              alt="PAPERCUT Unofficial Music Video">

            <div class="play-button">▶</div>
          </div>

          <div class="title">
            PAPERCUT Unofficial Music Video
          </div>

        </a>


        <!-- SENIOR PROJECT TRAILER -->
        <a
          class="video-card"
          href="https://vimeo.com/1229190469?share=copy&amp;fl=sv&amp;fe=ci"
          target="_blank"
          rel="noopener">

          <div class="thumbnail">
            <img
              src="https://vumbnail.com/1229190469.jpg"
              alt="Senior Project Trailer">

            <div class="play-button">▶</div>
          </div>

          <div class="title">
            Senior Project Trailer
          </div>

        </a>


        <!-- DOCUMENTARY -->
        <a
          class="video-card"
          href="https://vimeo.com/803558248?share=copy&amp;fl=sv&amp;fe=ci"
          target="_blank"
          rel="noopener">

          <div class="thumbnail">
            <img
              src="https://vumbnail.com/803558248.jpg"
              alt="Documentary">

            <div class="play-button">▶</div>
          </div>

          <div class="title">
            Documentary
          </div>

        </a>


        <!-- THE MONSTER -->
        <a
          class="video-card"
          href="https://vimeo.com/1229188766?share=copy&amp;fl=sv&amp;fe=ci"
          target="_blank"
          rel="noopener">

          <div class="thumbnail">
            <img
              src="https://vumbnail.com/1229188766.jpg"
              alt="The Monster">

            <div class="play-button">▶</div>
          </div>

          <div class="title">
            The Monster
          </div>

        </a>


        <!-- NIGHTMARE VIDEO ESSAY -->
        <a
          class="video-card"
          href="https://youtu.be/al-Pgjqdz_4"
          target="_blank"
          rel="noopener">

          <div class="thumbnail">
            <img
              src="https://img.youtube.com/vi/al-Pgjqdz_4/hqdefault.jpg"
              alt="Nightmare Video Essay">

            <div class="play-button">▶</div>
          </div>

          <div class="title">
            Nightmare Video Essay
          </div>

        </a>


        <!-- GUNK -->
        <a
          class="video-card"
          href="https://www.youtube.com/watch?v=vV7w-f7S6Q4"
          target="_blank"
          rel="noopener">

          <div class="thumbnail">
            <img
              src="https://img.youtube.com/vi/vV7w-f7S6Q4/hqdefault.jpg"
              alt="GUNK">

            <div class="play-button">▶</div>
          </div>

          <div class="title">
            GUNK
          </div>

        </a>

      </div>

    </div>

    <button
      class="arrow arrow-right"
      aria-label="Next video"
      onclick="move(1)">
      ›
    </button>

  </div>


  <script>
    function move(direction) {
      const c = document.getElementById('videoCarousel');

      c.scrollBy({
        left: direction * c.clientWidth,
        behavior: 'smooth'
      });
    }
  </script>

</body>

</html>
